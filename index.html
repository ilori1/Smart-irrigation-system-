<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTech Smart Irrigation Console</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
        }

        .card .title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card .value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        .controls {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-on { background: var(--success); }
        .btn-off { background: var(--danger); }
        .btn-auto { background: var(--primary); }

        .status-bar {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            background: #1e293b80;
            padding: 10px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Smart Agricultural Telemetry</h1>
            <p>Field Control & Telemetry Management System</p>
        </div>

        <div class="grid">
            <div class="card"><div class="title">Temperature</div><div class="value" id="temp">--</div></div>
            <div class="card"><div class="title">Humidity</div><div class="value" id="hum">--</div></div>
            <div class="card"><div class="title">Shallow Soil</div><div class="value" id="shallow">--</div></div>
            <div class="card"><div class="title">Deep Soil</div><div class="value" id="deep">--</div></div>
            <div class="card"><div class="title">Rainfall</div><div class="value" id="rain">--</div></div>
            <div class="card"><div class="title">Pump State</div><div class="value" id="pump">--</div></div>
            <div class="card"><div class="title">Active Run Time</div><div class="value" id="runtime">0s</div></div>
        </div>

        <div class="controls">
            <button class="btn btn-on" onclick="sendTalkbackCommand('TURN_ON')">FORCE PUMP ON</button>
            <button class="btn btn-off" onclick="sendTalkbackCommand('TURN_OFF')">FORCE PUMP OFF</button>
            <button class="btn btn-auto" onclick="sendTalkbackCommand('AUTO_MODE')">RESUME AUTO</button>
        </div>

        <div style="text-align: center;">
            <div class="status-bar" id="status">Syncing with ThingSpeak field node...</div>
        </div>
    </div>

    <script>
        const CHANNEL_ID = "3489654";
        const TALKBACK_ID = "57765";
        const TALKBACK_KEY = "NB5U4U4KOORPJ1O6";

        async function updateDashboard() {
            try {
                const res = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?cache=${Date.now()}`);
                if (!res.ok) throw new Error("HTTP connection error");
                
                const data = await res.json();

                document.getElementById('temp').innerText = (parseFloat(data.field1) || 0).toFixed(1) + ' °C';
                document.getElementById('hum').innerText  = (parseFloat(data.field2) || 0).toFixed(1) + ' %';
                document.getElementById('shallow').innerText = (data.field3 || '0') + ' %';
                document.getElementById('deep').innerText    = (data.field4 || '0') + ' %';
                
                // Rain Check
                const rainVal = parseInt(data.field5) || 0;
                document.getElementById('rain').innerText = rainVal > 50 ? 'YES' : 'NO';
                document.getElementById('rain').style.color = rainVal > 50 ? '#3b82f6' : '#f8fafc';
                
                // Pump Status
                const pumpActive = parseInt(data.field6) === 1;
                const pumpEl = document.getElementById('pump');
                pumpEl.innerText = pumpActive ? 'ACTIVE' : 'IDLE';
                pumpEl.style.color = pumpActive ? '#10b981' : '#ef4444';

                // Runtime Calculation Display (Seconds / Minutes conversion)
                const runSecs = parseInt(data.field7) || 0;
                if (runSecs > 60) {
                    const mins = Math.floor(runSecs / 60);
                    const secs = runSecs % 60;
                    document.getElementById('runtime').innerText = `${mins}m ${secs}s`;
                } else {
                    document.getElementById('runtime').innerText = `${runSecs}s`;
                }

                document.getElementById('status').innerText = `Telemetry synced at ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                document.getElementById('status').innerText = "Syncing telemetry data...";
            }
        }

        function sendTalkbackCommand(cmd) {
            document.getElementById('status').innerText = `Queuing command "${cmd}"...`;

            // Dynamic Form Submission Bypasses Browser CORS restrictions completely
            const iframe = document.createElement('iframe');
            iframe.name = 'tb_iframe';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = `https://api.thingspeak.com/talkbacks/${TALKBACK_ID}/commands`;
            form.target = 'tb_iframe';

            const keyInput = document.createElement('input');
            keyInput.type = 'hidden';
            keyInput.name = 'api_key';
            keyInput.value = TALKBACK_KEY;
            form.appendChild(keyInput);

            const cmdInput = document.createElement('input');
            cmdInput.type = 'hidden';
            cmdInput.name = 'command_string';
            cmdInput.value = cmd;
            form.appendChild(cmdInput);

            document.body.appendChild(form);
            form.submit();

            setTimeout(() => {
                document.getElementById('status').innerText = `Command "${cmd}" sent! Waiting for ESP32 polling cycle...`;
                document.body.removeChild(form);
                document.body.removeChild(iframe);
                updateDashboard();
            }, 1000);
        }

        setInterval(updateDashboard, 4000);
        updateDashboard();
    </script>
</body>
</html>
